services:
  - type: web
    name: ai-preprod-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    # The free tier (512 MB RAM) cannot load both ML models -- see
    # ml_models/README.md. Use at least the Standard plan (2 GB RAM).
    plan: standard
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: preprod-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RAZORPAY_KEY_ID
        value: your_key_id
      - key: RAZORPAY_KEY_SECRET
        value: your_key_secret
      - key: RUN_PIPELINE_SYNC
        value: "false"

databases:
  - name: preprod-db
    plan: starter
